[gammaR,Cd]: !FunctionMap
  map:
    gammaR: |
      depthVar = 1000.0;
      dGam = 0.0;
      uGam = 37150300000.0;
      if (z >= -depthVar) {
         return uGam - dGam*(depthVar + z)/depthVar;
      }
      return uGam;
    Cd: | #Reduce Cd to keep material isotropic for free surface
      depthVar = 1000.0;
      dCd = 990000.0;
      uCd = 1000000.0;
      if (z >= -depthVar) {
         return uCd - dCd*(depthVar + z)/depthVar;
      }
      return uCd;


